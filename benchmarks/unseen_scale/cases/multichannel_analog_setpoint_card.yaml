project: UnseenScale_Multichannel_Analog_Setpoint_Card
company: Circuit Weaver Benchmark
version: '1.0'
description: "72-channel analog setpoint card for a process controller. Thirty-six\
  \ dual 16-bit SPI DACs share data and clock; a cascaded 74HC595 bank selects each\
  \ DAC SYNC line. Every DAC output has its generated RC filter and a dedicated connector\
  \ for a high-impedance 0\u20133.3 V setpoint input. A shared 3.3 V precision reference\
  \ drives DAC VREF pins. Firmware updates one selected converter at a time; output\
  \ accuracy and load-drive capability are outside this workflow fixture."
pcb_constraints:
- kind: placement
  target: board
  width_mm: 300
  height_mm: 220
power:
- type: connector
  ic: BARREL_JACK_2.1MM
  ref: J1
  positive_net: VIN_12V
  negative_net: GND
  decoupling: true
- type: buck
  ic: AP62300
  ref: U1
  vin: 12
  vout: 5
  iout: 2
  vin_net: VIN_12V
  rail_name: VDD_5V
- type: buck
  ic: AP62300
  ref: U2
  vin: 5
  vout: 3.3
  iout: 1
  vin_net: VDD_5V
  rail_name: VDD_3P3
