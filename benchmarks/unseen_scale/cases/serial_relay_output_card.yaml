project: UnseenScale_Serial_Relay_Output_Card
company: Circuit Weaver Benchmark
version: '1.0'
description: 12 V industrial relay output card. An STM32 shifts channel states through
  cascaded 74HC595 registers; each output drives one ULN2003A sink channel and terminates
  at a dedicated keyed relay-coil connector. The ULN2003A includes inductive flyback
  diodes. OUTPUT_ENABLE_N is pulled high during reset so all sinks start disabled.
  This card has no fieldbus and uses the shift chain for output control.
pcb_constraints:
- kind: placement
  target: board
  width_mm: 340
  height_mm: 260
power:
- type: connector
  ic: BARREL_JACK_2.1MM
  ref: J1
  positive_net: VIN_12V
  negative_net: GND
  decoupling: true
- type: buck
  ic: AP62300
  ref: U1
  vin: 12
  vout: 3.3
  iout: 2
  vin_net: VIN_12V
  rail_name: VDD_3P3
- type: relay_driver
