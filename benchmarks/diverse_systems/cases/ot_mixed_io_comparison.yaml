project: Diverse_ot_mixed_io_comparison
company: Circuit Weaver Benchmark
version: '1.0'
description: 'Comparison fixture reuse: existing connected field gateway with analog inputs, RS-485, and
  CAN'
pcb_constraints:
- kind: placement
  target: board
  width_mm: 160
  height_mm: 120
power:
- type: connector
  ic: BARREL_JACK_2.1MM
  ref: J1
  positive_net: VIN_12V
  negative_net: GND
  decoupling: true
- type: buck
  ic: AP62300
  ref: U1
  vin: 12
  vout: 5
  iout: 2
  vin_net: VIN_12V
  rail_name: VDD_5V
- type: buck
  ic: AP62300
  ref: U2
  vin: 5
  vout: 3.3
  iout: 1
  vin_net: VDD_5V
  rail_name: VDD_3P3
digital:
- ic: STM32F103C8T6
  ref: U3
  pin_nets_extra:
    '25': SPI_CS_N
    '26': SPI_SCK
    '27': SPI_MISO
    '28': SPI_MOSI
    '30': FIELD_A_TX
    '31': FIELD_A_RX
    '29': FIELD_A_DE
    '12': FIELD_B_TX
    '13': FIELD_B_RX
    '11': FIELD_B_DE
    '21': FIELD_C_TX
    '22': FIELD_C_RX
    '20': FIELD_C_DE
    '33': CAN_TXD
    '32': CAN_RXD
  no_connects:
  - '2'
  - '3'
  - '4'
  - '5'
  - '6'
  - '10'
  - '14'
  - '15'
  - '16'
  - '17'
  - '18'
  - '19'
  - '34'
  - '37'
  - '38'
  - '39'
  - '40'
  - '41'
  - '42'
  - '43'
  - '45'
  - '46'
communication:
- type: rs485_transceiver
  ic: SP3485EN-L/TR
  ref: U4
  vdd_net: VDD_3P3
  txd_net: FIELD_A_TX
  rxd_net: FIELD_A_RX
  de_net: FIELD_A_DE
  bus_net_prefix: FIELD_A_RS485
  termination: true
  failsafe_bias: true
- type: rs485_transceiver
  ic: SP3485EN-L/TR
  ref: U5
  vdd_net: VDD_3P3
  txd_net: FIELD_B_TX
  rxd_net: FIELD_B_RX
  de_net: FIELD_B_DE
  bus_net_prefix: FIELD_B_RS485
  termination: true
  failsafe_bias: true
- type: rs485_transceiver
  ic: SP3485EN-L/TR
  ref: U6
  vdd_net: VDD_3P3
  txd_net: FIELD_C_TX
  rxd_net: FIELD_C_RX
  de_net: FIELD_C_DE
  bus_net_prefix: FIELD_C_RS485
  termination: true
  failsafe_bias: true
- type: can_transceiver
  ic: SN65HVD230
  params:
    ic: SN65HVD230
  ref: U7
  vdd_net: VDD_3P3
  txd_net: CAN_TXD
  rxd_net: CAN_RXD
  bus_net_prefix: FIELD_CAN
  termination: true
analog:
- type: adc
  ic: MCP3208-CI/SL
  params:
    ic: MCP3208-CI/SL
  ref: U8
  vdd_net: VDD_3P3
  channels: 8
  input_filter_bw: 250
  cs_net: SPI_CS_N
  spi_mosi_net: SPI_MOSI
  spi_miso_net: SPI_MISO
  spi_sck_net: SPI_SCK
- type: voltage_reference
  ic: REF3030
  params:
    ic: REF3030
  ref: U15
  vin: 5
  vin_net: VDD_5V
  vref_net: REF_U9
  interfaces:
  - name: REF_U9
    direction: output
- type: voltage_reference
  ic: REF3030
  params:
    ic: REF3030
  ref: U16
  vin: 5
  vin_net: VDD_5V
  vref_net: REF_U10
  interfaces:
  - name: REF_U10
    direction: output
- type: voltage_reference
  ic: REF3030
  params:
    ic: REF3030
  ref: U17
  vin: 5
  vin_net: VDD_5V
  vref_net: REF_U11
  interfaces:
  - name: REF_U11
    direction: output
- type: voltage_reference
  ic: REF3030
  params:
    ic: REF3030
  ref: U18
  vin: 5
  vin_net: VDD_5V
  vref_net: REF_U12
  interfaces:
  - name: REF_U12
    direction: output
- type: voltage_reference
  ic: REF3030
  params:
    ic: REF3030
  ref: U19
  vin: 5
  vin_net: VDD_5V
  vref_net: REF_U13
  interfaces:
  - name: REF_U13
    direction: output
- type: voltage_reference
  ic: REF3030
  params:
    ic: REF3030
  ref: U20
  vin: 5
  vin_net: VDD_5V
  vref_net: REF_U14
  interfaces:
  - name: REF_U14
    direction: output
- type: sensor_frontend
  ic: INA128PA
  ref: U9
  gain: 5
  vdd_net: VDD_5V
  sensor_p_net: FIELD_AI0_P
  sensor_n_net: FIELD_AI0_N
  output_net: CH0_U8
  interfaces:
  - name: REF_U9
    direction: input
- type: sensor_frontend
  ic: INA128PA
  ref: U10
  gain: 5
  vdd_net: VDD_5V
  sensor_p_net: FIELD_AI1_P
  sensor_n_net: FIELD_AI1_N
  output_net: CH1_U8
  interfaces:
  - name: REF_U10
    direction: input
- type: sensor_frontend
  ic: INA128PA
  ref: U11
  gain: 5
  vdd_net: VDD_5V
  sensor_p_net: FIELD_AI2_P
  sensor_n_net: FIELD_AI2_N
  output_net: CH2_U8
  interfaces:
  - name: REF_U11
    direction: input
- type: sensor_frontend
  ic: INA128PA
  ref: U12
  gain: 5
  vdd_net: VDD_5V
  sensor_p_net: FIELD_AI3_P
  sensor_n_net: FIELD_AI3_N
  output_net: CH3_U8
  interfaces:
  - name: REF_U12
    direction: input
- type: sensor_frontend
  ic: INA128PA
  ref: U13
  gain: 5
  vdd_net: VDD_5V
  sensor_p_net: FIELD_AI4_P
  sensor_n_net: FIELD_AI4_N
  output_net: CH4_U8
  interfaces:
  - name: REF_U13
    direction: input
- type: sensor_frontend
  ic: INA128PA
  ref: U14
  gain: 5
  vdd_net: VDD_5V
  sensor_p_net: FIELD_AI5_P
  sensor_n_net: FIELD_AI5_N
  output_net: CH5_U8
  interfaces:
  - name: REF_U14
    direction: input
- type: voltage_reference
  ic: REF3030
  params:
    ic: REF3030
  ref: U21
  vin: 5
  vin_net: VDD_5V
  vref_net: REF_U23
  interfaces:
  - name: REF_U23
    direction: output
- type: voltage_reference
  ic: REF3030
  params:
    ic: REF3030
  ref: U22
  vin: 5
  vin_net: VDD_5V
  vref_net: REF_U24
  interfaces:
  - name: REF_U24
    direction: output
- type: sensor_frontend
  ic: INA128PA
  ref: U23
  gain: 5
  vdd_net: VDD_5V
  sensor_p_net: FIELD_AI6_P
  sensor_n_net: FIELD_AI6_N
  output_net: CH6_U8
  interfaces:
