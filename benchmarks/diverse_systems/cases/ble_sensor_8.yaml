project: Diverse_nRF52840_BLE_Sensor_Node
company: Circuit Weaver Benchmark
version: '1.0'
description: 'BLE sensor-node prototype: nRF52840-QIAA with 32 MHz crystal, connected eight-channel MCP3208
  acquisition and SPI DAC/control channels. SPI uses Nordic P0.13/P0.14/P0.15/P0.16. A direct ANT test
  port is present; RF behavior and firmware are outside scope.'
pcb_constraints:
- kind: placement
  target: board
  width_mm: 180
  height_mm: 135
power:
- type: connector
  ic: BARREL_JACK_2.1MM
  ref: J1
  positive_net: VIN_12V
  negative_net: GND
  decoupling: true
- type: buck
  ic: AP62300
  ref: U1
  vin: 12
  vout: 5
  iout: 2
  vin_net: VIN_12V
  rail_name: VDD_5V
- type: buck
  ic: AP62300
  ref: U2
  vin: 5
  vout: 3.3
  iout: 1
  vin_net: VDD_5V
  rail_name: VDD_3P3
digital:
- ic: nRF52840-QIAA
  ref: U4
  pin_nets_extra:
    AD8: SPI_SCK
    AC9: SPI_MOSI
    AD10: SPI_MISO
    AC11: ADC_CS_N
    G1: I2C_SCL
    J1: I2C_SDA
    A14: DAC_SYNC_N
    AD12: ACTUATOR_ENABLE
    H23: RF_IN
  no_connects:
  - AA24
  - AC24
  - AC13
  - B3
  - AB2
- ic: 32MHz-XTAL-CL8
  ref: Y1
sensors:
- ic: BME280
  ref: U5
  vdd_net: VDD_3P3
  pin_nets_extra:
    '3': I2C_SDA
    '4': I2C_SCL
    '5': VDD_3P3
  power_pins_extra:
    '1': GND
    '6': VDD_3P3
    '7': GND
    '8': VDD_3P3
analog:
- type: voltage_reference
  ic: REF3030
  params:
    ic: REF3030
  ref: U19
  vin: 5
  vin_net: VDD_5V
  vref_net: REF_U11
  interfaces:
  - name: REF_U11
    direction: output
- type: voltage_reference
  ic: REF3030
  params:
    ic: REF3030
  ref: U20
  vin: 5
  vin_net: VDD_5V
  vref_net: REF_U12
  interfaces:
  - name: REF_U12
    direction: output
- type: voltage_reference
  ic: REF3030
  params:
    ic: REF3030
  ref: U21
  vin: 5
  vin_net: VDD_5V
  vref_net: REF_U13
  interfaces:
  - name: REF_U13
    direction: output
- type: voltage_reference
  ic: REF3030
  params:
    ic: REF3030
  ref: U22
  vin: 5
  vin_net: VDD_5V
  vref_net: REF_U14
  interfaces:
  - name: REF_U14
    direction: output
- type: voltage_reference
  ic: REF3030
  params:
    ic: REF3030
  ref: U23
  vin: 5
  vin_net: VDD_5V
  vref_net: REF_U15
  interfaces:
  - name: REF_U15
    direction: output
- type: voltage_reference
  ic: REF3030
  params:
    ic: REF3030
  ref: U24
  vin: 5
  vin_net: VDD_5V
  vref_net: REF_U16
  interfaces:
  - name: REF_U16
    direction: output
- type: voltage_reference
  ic: REF3030
  params:
    ic: REF3030
  ref: U25
  vin: 5
  vin_net: VDD_5V
  vref_net: REF_U17
  interfaces:
  - name: REF_U17
    direction: output
- type: voltage_reference
  ic: REF3030
  params:
    ic: REF3030
  ref: U26
  vin: 5
  vin_net: VDD_5V
  vref_net: REF_U18
  interfaces:
  - name: REF_U18
    direction: output
- type: adc
  ic: MCP3208-CI/SL
  params:
    ic: MCP3208-CI/SL
  ref: U7
  vdd_net: VDD_3P3
  vref_net: ADC_REF_3V3
  channels: 8
  input_filter_bw: 500
  cs_net: ADC_CS_N
  spi_mosi_net: SPI_MOSI
  spi_miso_net: SPI_MISO
  spi_sck_net: SPI_SCK
  interfaces:
  - name: ADC_REF_3V3
    direction: input
- type: voltage_reference
  ic: REF3033
  params:
    ic: REF3033
  ref: U6
  vin: 5
  vin_net: VDD_5V
  vref_net: ADC_REF_3V3
  iload: 0.01
  interfaces:
  - name: ADC_REF_3V3
    direction: output
- type: dac
  ic: DAC8552IDGK
  params:
    ic: DAC8552IDGK
  ref: U8
  vdd_net: VDD_3P3
  vref: VDD_3P3
  din_net: SPI_MOSI
  sclk_net: SPI_SCK
  sync_net: DAC_SYNC_N
  output_net: DAC_RAW_A
  output_b_net: DAC_RAW_B
- type: opamp
  ic: LM358
  ref: U27
  config: follower
  vdd_net: VDD_5V
  in_net: DAC_RAW_A
  out_net: ACTUATOR_SETPOINT
- type: opamp
  ic: LM358
  ref: U28
  config: follower
  vdd_net: VDD_5V
  in_net: DAC_RAW_B
  out_net: ACTUATOR_SETPOINT_AUX
- type: opamp
  ic: LM358
  ref: U9
  config: follower
  vdd_net: VDD_5V
  in_net: PREAMP0_OUT
  out_net: CH0_U7
- type: opamp
  ic: LM358
  ref: U10
  config: follower
  vdd_net: VDD_5V
  in_net: PREAMP1_OUT
  out_net: CH1_U7
- type: sensor_frontend
  ic: INA128PA
  ref: U11
  gain: 5
  vdd_net: VDD_5V
  sensor_p_net: SENSOR0_P
  sensor_n_net: SENSOR0_N
  output_net: PREAMP0_OUT
  interfaces:
  - name: REF_U11
    direction: input
- type: sensor_frontend
  ic: INA128PA
  ref: U12
  gain: 5
  vdd_net: VDD_5V
  sensor_p_net: SENSOR1_P
  sensor_n_net: SENSOR1_N
  output_net: PREAMP1_OUT
  interfaces:
  - name: REF_U12
    direction: input
- type: sensor_frontend
  ic: INA128PA
  ref: U13
  gain: 5
  vdd_net: VDD_5V
  sensor_p_net: SENSOR2_P
  sensor_n_net: SENSOR2_N
  output_net: CH2_U7
  interfaces:
  - name: REF_U13
    direction: input
- type: sensor_frontend
  ic: INA128PA
  ref: U14
  gain: 5
  vdd_net: VDD_5V
  sensor_p_net: SENSOR3_P
  sensor_n_net: SENSOR3_N
  output_net: CH3_U7
  interfaces:
  - name: REF_U14
    direction: input
- type: sensor_frontend
  ic: INA128PA
  ref: U15
  gain: 5
  vdd_net: VDD_5V
  sensor_p_net: SENSOR4_P
  sensor_n_net: SENSOR4_N
  output_net: CH4_U7
  interfaces:
  - name: REF_U15
    direction: input
- type: sensor_frontend
  ic: INA128PA
  ref: U16
  gain: 5
  vdd_net: VDD_5V
  sensor_p_net: SENSOR5_P
  sensor_n_net: SENSOR5_N
  output_net: CH5_U7
  interfaces:
  - name: REF_U16
    direction: input
- type: sensor_frontend
  ic: INA128PA
  ref: U17
  gain: 5
  vdd_net: VDD_5V
  sensor_p_net: SENSOR6_P
  sensor_n_net: SENSOR6_N
  output_net: CH6_U7
  interfaces:
  - name: REF_U17
    direction: input
- type: sensor_frontend
  ic: INA128PA
  ref: U18
  gain: 5
  vdd_net: VDD_5V
  sensor_p_net: SENSOR7_P
  sensor_n_net: SENSOR7_N
  output_net: CH7_U7
  interfaces:
  - name: REF_U18
    direction: input
connectors:
- type: connector
  ic: PIN_HEADER_4P
  ref: J2
  signal_nets: SENSOR0_P,SENSOR0_N,VDD_5V,GND
- type: connector
  ic: PIN_HEADER_4P
  ref: J3
  signal_nets: SENSOR1_P,SENSOR1_N,VDD_5V,GND
- type: connector
  ic: PIN_HEADER_4P
  ref: J4
  signal_nets: SENSOR2_P,SENSOR2_N,VDD_5V,GND
- type: connector
  ic: PIN_HEADER_4P
  ref: J5
  signal_nets: SENSOR3_P,SENSOR3_N,VDD_5V,GND
- type: connector
  ic: PIN_HEADER_4P
  ref: J6
  signal_nets: SENSOR4_P,SENSOR4_N,VDD_5V,GND
- type: connector
  ic: PIN_HEADER_4P
  ref: J7
  signal_nets: SENSOR5_P,SENSOR5_N,VDD_5V,GND
- type: connector
  ic: PIN_HEADER_4P
  ref: J8
  signal_nets: SENSOR6_P,SENSOR6_N,VDD_5V,GND
- type: connector
  ic: PIN_HEADER_4P
  ref: J9
  signal_nets: SENSOR7_P,SENSOR7_N,VDD_5V,GND
- type: connector
  ic: PIN_HEADER_4P
  ref: J10
  signal_nets: I2C_SDA,I2C_SCL,VDD_3P3,GND
- type: connector
  ic: PIN_HEADER_4P
  ref: J11
  signal_nets: ACTUATOR_SETPOINT,ACTUATOR_SETPOINT_AUX,VDD_3P3,GND
- type: connector
  ic: PIN_HEADER_2P
  ref: J12
  signal_nets: ACTUATOR_ENABLE,GND
- ic: SMA-EDGE
  ref: J90
protection:
- type: protection
  ic: SMBJ12A
  ref: D1
  protect_net: VIN_12V
  protection_type: tvs
