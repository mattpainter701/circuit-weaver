    '32': CAN_RXD
    '10': FIELD_D_TX
    '14': FIELD_D_RX
    '15': FIELD_D_DE
    '16': FIELD_E_TX
    '17': FIELD_E_RX
    '18': FIELD_E_DE
    '19': FIELD_F_TX
    '38': FIELD_F_RX
    '39': FIELD_F_DE
    '40': FIELD_G_TX
    '41': FIELD_G_RX
    '42': FIELD_G_DE
    '43': SCLK_U90
    '2': SDIO_U90
    '3': SDO_U90
    '4': CSB_U90
    '45': RESETB_U90
  no_connects:
  - '5'
  - '6'
  - '34'
  - '37'
  - '46'
