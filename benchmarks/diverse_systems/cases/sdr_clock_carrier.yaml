project: Diverse_AD9528_SDR_Clock_Carrier
company: Circuit Weaver Benchmark
version: '1.0'
description: External SDR clock/control carrier prototype built around one AD9528 clock synthesizer. Four
  module slots each receive three differential clock pairs; an STM32 controls the clock IC over SPI. RF
  transceivers, ADC data lanes, jitter/phase noise, and high-speed SI are external and unqualified.
pcb_constraints:
- kind: placement
  target: board
  width_mm: 260
  height_mm: 190
power:
- type: connector
  ic: BARREL_JACK_2.1MM
  ref: J1
  positive_net: VIN_12V
  negative_net: GND
  decoupling: true
- type: buck
  ic: AP62300
  ref: U1
  vin: 12
  vout: 5
  iout: 2
  vin_net: VIN_12V
  rail_name: VDD_5V
- type: buck
  ic: AP62300
  ref: U2
  vin: 5
  vout: 3.3
  iout: 1
  vin_net: VDD_5V
  rail_name: VDD_3P3
- type: ldo
  ic: MCP1700-1802E
  ref: U80
  vin: 3.3
  vout: 1.8
  vin_net: VDD_3P3
  rail_name: VDD_1P8
digital:
- ic: STM32F103C8T6
