project: Diverse_Relay_Output_Card_768
company: Circuit Weaver Benchmark
version: '1.0'
description: Prototype 12 V relay output card with 768 individually addressed coil-return channels. A
  96-device cascaded 74HC595 chain drives 110 ULN2003A sink arrays; each output has its own two-pin field
  connector. This is a connectivity/layout stress fixture, not a safety-rated product.
