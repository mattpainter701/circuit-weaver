project: GeneralScale_Precision_Control_DAQ
company: Circuit Weaver Benchmark
version: '1.0'
description: Precision acquisition and setpoint controller with eight bridge/load channels, ADC reference, and a dual-channel SPI DAC. Each INA128 uses a 5V supply, local 3.0V REF, 2.5V input common mode, and +/-50mV maximum differential at gain 5, yielding nominal 2.75-3.25V ADC inputs.
pcb_constraints:
- kind: placement
  target: board
  width_mm: 150
  height_mm: 110
power:
- type: connector
  ic: BARREL_JACK_2.1MM
  ref: J1
  positive_net: VIN_12V
  negative_net: GND
  decoupling: true
- type: buck
  ic: AP62300
  ref: U1
  vin: 12
  vout: 5
  iout: 2
  vin_net: VIN_12V
  rail_name: VDD_5V
- type: buck
  ic: AP62300
  ref: U2
  vin: 5
  vout: 3.3
  iout: 1
  vin_net: VDD_5V
  rail_name: VDD_3P3
- type: ldo
  ic: TLV75518
  ref: U3
  vin: 3.3
  vout: 1.8
  vin_net: VDD_3P3
  rail_name: VDD_1P8
digital:
- ic: STM32F103C8T6
  ref: U4
  pin_nets_extra:
    '25': ADC_CS_N
    '26': SPI_SCK
    '27': SPI_MISO
    '28': SPI_MOSI
    '14': DAC_SYNC_N
  no_connects:
  - '2'
  - '3'
  - '4'
  - '5'
  - '6'
  - '10'
  - '11'
  - '12'
  - '13'
  - '15'
  - '16'
  - '17'
  - '18'
  - '19'
  - '20'
  - '21'
  - '22'
  - '29'
  - '30'
  - '31'
  - '32'
  - '33'
  - '34'
  - '37'
  - '38'
  - '39'
  - '40'
  - '41'
  - '42'
  - '43'
  - '45'
  - '46'
analog:
- type: adc
  ic: MCP3208-CI/SL
  params:
    ic: MCP3208-CI/SL
  ref: U5
  vdd_net: VDD_3P3
  vref_net: ADC_REF_3V3
  channels: 8
  input_filter_bw: 100
  cs_net: ADC_CS_N
  spi_mosi_net: SPI_MOSI
  spi_miso_net: SPI_MISO
  spi_sck_net: SPI_SCK
  interfaces:
  - name: ADC_REF_3V3
    direction: input
- type: voltage_reference
  ic: REF3033
  params:
    ic: REF3033
  ref: U6
  vin: 5
  vin_net: VDD_5V
  vref_net: ADC_REF_3V3
  iload: 0.01
  interfaces:
  - name: ADC_REF_3V3
    direction: output
- type: voltage_reference
  ic: REF3030
  params:
    ic: REF3030
  ref: U18
  vin: 5
  vin_net: VDD_5V
  vref_net: REF_U7
