  ref: U19
  vin: 5
  vin_net: VDD_5V
  vref_net: REF_U8
  interfaces:
  - name: REF_U8
    direction: output
- type: voltage_reference
  ic: REF3030
  params:
    ic: REF3030
  ref: U20
  vin: 5
  vin_net: VDD_5V
