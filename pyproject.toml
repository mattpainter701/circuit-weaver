[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-weaver"
dynamic = ["version"]
description = "Programmatic circuit design, validation, and KiCad artifact generation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Matt Painter" },
]
keywords = ["kicad", "eda", "schematic", "pcb", "automation", "circuit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
api = ["fastapi>=0.111,<1", "uvicorn>=0.29,<1", "python-multipart>=0.0.7,<1"]
mcp = ["mcp>=1.26,<2"]
# Kept as a compatibility alias for existing `circuit-weaver[yaml]` installs.
yaml = ["PyYAML>=6.0,<7"]
lookup = ["requests>=2.31,<3"]
pdf = ["pypdf>=5,<7"]
test = [
  "fastapi>=0.111,<1",
  "uvicorn>=0.29,<1",
  "python-multipart>=0.0.7,<1",
  "mcp>=1.26,<2",
  "requests>=2.31,<3",
  "pypdf>=5,<7",
  "pytest>=8,<10",
  "ruff>=0.4,<1",
  "httpx>=0.27,<0.29",
  "build>=1.2,<2",
  "twine>=5,<7",
]
dev = [
  "fastapi>=0.111,<1",
  "uvicorn>=0.29,<1",
  "python-multipart>=0.0.7,<1",
  "mcp>=1.26,<2",
  "requests>=2.31,<3",
  "pypdf>=5,<7",
  "pytest>=8,<10",
  "ruff>=0.4,<1",
  "httpx>=0.27,<0.29",
  "build>=1.2,<2",
  "twine>=5,<7",
  "pre-commit>=3.7,<5",
]
all = [
  "fastapi>=0.111,<1",
  "uvicorn>=0.29,<1",
  "python-multipart>=0.0.7,<1",
  "mcp>=1.26,<2",
  "requests>=2.31,<3",
  "pypdf>=5,<7",
]

[project.scripts]
circuit-weaver = "circuit_weaver.__main__:main"
circuit-weaver-mcp = "circuit_weaver.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "circuit_weaver.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
circuit_weaver = [
  "_bundled_skills/**/*.md",
  "_bundled_skills/**/*.py",
  "examples/*.yaml",
  "ic_data/*.json",
  "model_assets/*.json",
  "model_assets/*.md",
  "model_assets/*.yaml",
  "model_assets/*.step",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["src/circuit_weaver/_bundled_skills"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: tests that require live network access",
  "skip_category(category): classify a skip as platform, optional-tool, network, or defect",
]
