# Heddle PCIe x1 host card (review draft).
#
# A commodity PCI Express bridge gives the PC an SPI master and four GPIOs.
# SPI reaches the tile's uio[3:0] port through the Tiny Tapeout IHP breakout
# headers; the GPIOs drive the shuttle's project-select mux and the tile
# reset. A 25 MHz oscillator supplies the tile clock. Part pin data lives in
# components.json beside this file. README.md lists the items that still need
# the vendor reference schematic or a mechanical check before layout.
project: Heddle_PCIe_Card
company: Circuit Weaver contributors
# Resolved against the working directory: run Circuit Weaver from the repository root.
components_db: asic/heddle/card/components.json
description: 'PCI Express x1 host card for the Heddle Tiny Tapeout tile: bridge to SPI and mux-control GPIO, breakout headers,
  tile clock'
# Every part and net below is explicit. The tool must not add or guess any.
