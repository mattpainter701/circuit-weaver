name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Ruff
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python -m ruff check src tests

      - name: Verify generated capability documentation
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python scripts/gen_capability_docs.py --check

      - name: Verify electrical benchmark baseline
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python benchmarks/run.py --check-baseline --output .test-tmp/electrical-benchmark.json

      - name: Pytest (full, including integration corpus)
        run: >-
          python -c "import os, pytest;
          os.environ.pop('CI', None);
          os.environ['CIRCUIT_WEAVER_TEST_PACKAGE'] = 'source';
          raise SystemExit(pytest.main(['tests', '-q']))"

      - name: CLI smoke test
        run: python -m circuit_weaver --version

  distribution:
    name: Build exact distribution artifact
    needs: [test, bundled-skills]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build distribution once
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" "twine>=5,<7"
          python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Validate wheel payload
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheels = glob.glob("dist/*.whl")
          archives = glob.glob("dist/*.tar.gz")
          assert len(wheels) == 1, wheels
          assert len(archives) == 1, archives
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
          assert "circuit_weaver/examples/iot_sensor.yaml" in names
          assert not any("__pycache__" in name or name.endswith((".pyc", ".pyo")) for name in names)
          with tarfile.open(archives[0], "r:gz") as source_archive:
              source_names = source_archive.getnames()
          assert any(name.endswith("/src/circuit_weaver/examples/iot_sensor.yaml") for name in source_names)
          assert not any(
              "__pycache__" in name or name.endswith((".pyc", ".pyo"))
              for name in source_names
          )
          PY

      - name: Install and test the exact wheel
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name 'circuit_weaver-*.whl' -print -quit)
          test -n "$wheel"
          python -m venv .wheel-test
          .wheel-test/bin/python -m pip install --upgrade pip
          .wheel-test/bin/python -m pip install "${wheel}[test]"
          CIRCUIT_WEAVER_TEST_PACKAGE=wheel .wheel-test/bin/python -m pytest tests/test_release_contract.py tests/test_mcp_server.py -q

      - name: Upload exact distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: ci-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  test-wheel:
    name: Exact wheel / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    needs: distribution
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout tests
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download exact distribution artifact
        uses: actions/download-artifact@v8
        with:
          name: ci-distributions
          path: dist

      - name: Install exact wheel with test dependencies
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name 'circuit_weaver-*.whl' -print -quit)
          test -n "$wheel"
          python -m pip install --upgrade pip
          python -m pip install "${wheel}[test]"

      - name: Test exact wheel (full suite, including integration corpus)
        run: >-
          python -c "import os, pytest;
          os.environ.pop('CI', None);
          os.environ['CIRCUIT_WEAVER_TEST_PACKAGE'] = 'wheel';
          raise SystemExit(pytest.main(['tests', '-q']))"

  bundled-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify bundled skills match skills/
        run: python scripts/sync_bundled_skills.py --check

  kicad-validation:
    name: KiCad ${{ matrix.kicad-major }} final-artifact validation
    needs: test-wheel
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.container-image }}
      options: --user 0
    timeout-minutes: 90
    env:
      CIRCUIT_WEAVER_TEST_PACKAGE: wheel
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - kicad-major: "8"
            container-image: ghcr.io/kicad/kicad:8.0@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
          - kicad-major: "9"
            container-image: ghcr.io/kicad/kicad:9.0@sha256:e638b79b0321f29395a5b783e94bb9f3c73303e8da15da27b8f5cb4b67a37729
          - kicad-major: "10"
            container-image: ghcr.io/kicad/kicad:10.0.6-full@sha256:e36e29b5f4a638a1a7238eba3d2fcbc8e061ffed1e99a8f39cb722706c94a58e

    steps:
      - name: Install checkout and validation prerequisites in the KiCad container
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -o Acquire::Retries=3 -o APT::Update::Error-Mode=any
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends -o Acquire::Retries=3 \
            python3-venv curl git ca-certificates

      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare official KiCad container and runtime
        shell: bash
        run: bash scripts/prepare_kicad_ci_container.sh "${{ matrix.kicad-major }}"

      - name: Download exact tested distribution artifact
        uses: actions/download-artifact@v8
        with:
          name: ci-distributions
          path: dist

      - name: Install exact Circuit Weaver wheel with MCP
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name 'circuit_weaver-*.whl' -print -quit)
          test -n "$wheel"
          python -m pip install "${wheel}[mcp]" pytest

      - name: Verify MCP workflow client dependency
        run: python -c "from mcp import ClientSession, StdioServerParameters; from mcp.client.stdio import stdio_client"

      - name: Generate and verify representative final schematics
        run: |
          python -m circuit_weaver generate samples/iot_sensor_node/iot_sensor_node.yaml --output .ci-kicad/iot --require-kicad --no-svg
          python -m circuit_weaver generate samples/fpga_power_carrier/fpga_power_carrier.yaml --output .ci-kicad/fpga --require-kicad --no-svg

      - name: Require zero KiCad ERC violations
        run: |
          kicad-cli sch erc --exit-code-violations --format json --output .ci-kicad/iot/erc.json .ci-kicad/iot/IoT_Sensor_Node.kicad_sch
          kicad-cli sch erc --exit-code-violations --format json --output .ci-kicad/fpga/erc.json .ci-kicad/fpga/FPGA_Power_Carrier.kicad_sch
          test -s .ci-kicad/iot/erc.json
          test -s .ci-kicad/fpga/erc.json

      - name: Round-trip authoritative 2-layer and 4-layer PCB goldens
        run: python -m pytest tests/test_pcb_handoff.py -q -k golden_round_trip

      - name: Setup routing runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Verify pinned Freerouting and route real basic circuits
        env:
          CIRCUIT_WEAVER_KICAD_PYTHON: /usr/bin/python3
          CIRCUIT_WEAVER_FREEROUTING: /tmp/freerouting-2.4.1.jar
          CW_REQUIRE_NATIVE_PCB_TESTS: "1"
          CW_NATIVE_PCB_EVIDENCE: .ci-kicad/native-pcb
        run: |
          curl --fail --location --retry 3 https://github.com/freerouting/freerouting/releases/download/v2.4.1/freerouting-2.4.1.jar -o /tmp/freerouting-2.4.1.jar
          echo '251101c3eeac22d7e7dfcf6796603279e5d1000283eb82d8f093780f7afc6aa9  /tmp/freerouting-2.4.1.jar' | sha256sum --check
          python -m pytest tests/test_package_pin_bindings.py tests/test_voltage_reference_catalog_contract.py tests/test_native_sample_footprints.py tests/test_native_pcb_workflow.py tests/test_native_pcb_preview.py tests/test_native_silkscreen.py tests/test_native_return_paths_integration.py tests/test_native_pcb_copper_cleanup_integration.py tests/test_native_copper_cleanup_engine.py tests/test_native_ground_plane_engine.py tests/test_native_ground_plane_integration.py tests/test_native_plane_stitch_integration.py tests/test_native_plane_cleanup_engine.py tests/test_native_plane_cleanup_integration.py -q

      - name: Validate generated schematic through routed prototype and export gate
        env:
          CIRCUIT_WEAVER_KICAD_PYTHON: /usr/bin/python3
          CIRCUIT_WEAVER_FREEROUTING: /tmp/freerouting-2.4.1.jar
        run: python scripts/validate_app_workflow.py --output .ci-kicad/native-pcb/generated-workflow

      - name: Validate all samples with native assembled previews and MCP
        if: matrix.kicad-major == '10'
        env:
          CIRCUIT_WEAVER_KICAD_PYTHON: /usr/bin/python3
          CIRCUIT_WEAVER_FREEROUTING: /tmp/freerouting-2.5.0.jar
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/freerouting/freerouting/releases/download/v2.5.0/freerouting-2.5.0.jar -o /tmp/freerouting-2.5.0.jar
          echo 'f6f51bb02245e8e717f9359bd260cc9c5c0b1bc0acc8b7cb2cd5b8ffeb5de3c7  /tmp/freerouting-2.5.0.jar' | sha256sum --check
          wheel=$(find dist -maxdepth 1 -name 'circuit_weaver-*.whl' -print -quit)
          test -n "$wheel"
          python benchmarks/general_scale/run_general_scale.py --suite samples \
            --output .ci-kicad/native-pcb/sample-workflows --require-clean \
            --installed --expected-wheel "$wheel" \
            --workers 2 --iterations 6000 --attempts 3 --route-timeout 600 \
            --route-max-passes 20 --repair-open-connections --recovery-timeout 600

      - name: Validate diverse 100-part native workflows and channel connectivity
        if: matrix.kicad-major == '10'
        env:
          CIRCUIT_WEAVER_KICAD_PYTHON: /usr/bin/python3
          CIRCUIT_WEAVER_FREEROUTING: /tmp/freerouting-2.4.1.jar
        run: >-
          python benchmarks/general_scale/run_general_scale.py
          --output .ci-kicad/native-pcb/general-scale --require-clean
          --workers 2 --iterations 6000 --attempts 3 --route-timeout 600

      - name: Require complete shared four-layer CAD acceptance on the installed package
        if: matrix.kicad-major == '10'
        env:
          CIRCUIT_WEAVER_KICAD_PYTHON: /usr/bin/python3
          CIRCUIT_WEAVER_FREEROUTING: /tmp/freerouting-2.4.1.jar
        run: >-
          python benchmarks/four_layer_acceptance/run_acceptance.py
          --case iot_environment_node --through preview --engine-mode installed
          --require-cad --output .ci-kicad/native-pcb/four-layer-acceptance

      - name: Preserve real PCB validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-pcb-kicad-${{ matrix.kicad-major }}
          path: .ci-kicad/native-pcb
          include-hidden-files: true
          if-no-files-found: warn

  unseen-scale-validation:
    name: Unseen native scale / ${{ matrix.case }}
    needs: [distribution, kicad-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/kicad/kicad:10.0.6-full@sha256:e36e29b5f4a638a1a7238eba3d2fcbc8e061ffed1e99a8f39cb722706c94a58e
      options: --user 0
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case: [distributed_facility_gateway, serial_relay_output_card, multichannel_analog_setpoint_card]
    steps:
      - name: Install checkout and native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -o Acquire::Retries=3 -o APT::Update::Error-Mode=any
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends -o Acquire::Retries=3 \
            python3-venv curl git ca-certificates

      - name: Checkout benchmark and validation scripts
        uses: actions/checkout@v7

      - name: Prepare official KiCad runtime
        shell: bash
        run: bash scripts/prepare_kicad_ci_container.sh 10

      - name: Download exact tested distribution artifact
        uses: actions/download-artifact@v8
        with:
          name: ci-distributions
          path: dist

      - name: Install exact wheel with MCP runtime
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find dist -maxdepth 1 -name 'circuit_weaver-*.whl' -print -quit)
          test -n "$wheel"
          python -m pip install "${wheel}[mcp]"

      - name: Set up routing runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Verify pinned recovery router and run every prototype stage
        shell: bash
        env:
          CIRCUIT_WEAVER_KICAD_PYTHON: /usr/bin/python3
          CIRCUIT_WEAVER_FREEROUTING: /tmp/freerouting-2.5.0.jar
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/freerouting/freerouting/releases/download/v2.5.0/freerouting-2.5.0.jar -o /tmp/freerouting-2.5.0.jar
          echo 'f6f51bb02245e8e717f9359bd260cc9c5c0b1bc0acc8b7cb2cd5b8ffeb5de3c7  /tmp/freerouting-2.5.0.jar' | sha256sum --check
          wheel=$(find dist -maxdepth 1 -name 'circuit_weaver-*.whl' -print -quit)
          python benchmarks/general_scale/run_general_scale.py \
            --suite benchmarks/unseen_scale/cases.yaml --case '${{ matrix.case }}' \
            --output .ci-kicad/unseen-scale --installed --expected-wheel "$wheel" \
            --require-clean --workers 1 --iterations 6000 --attempts 3 \
            --route-timeout 1800 --route-max-passes 20 \
            --repair-open-connections --recovery-timeout 1800 --timeout 7200

      - name: Preserve full workflow, connectivity, and assembled preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unseen-native-${{ matrix.case }}
          path: .ci-kicad/unseen-scale
          include-hidden-files: true
          if-no-files-found: warn
