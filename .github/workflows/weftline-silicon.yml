name: Weftline silicon

on:
  workflow_dispatch:
  pull_request:
    paths:
      - asic/slot16/**
      - .github/workflows/weftline-silicon.yml

permissions:
  contents: read

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v7
        with:
          repository: TinyTapeout/tt-support-tools
          ref: 7d2d2ef5261eb1df16d0bc342834d48a8a276881
          path: tt
      - name: Harden 3x2 SRAM tile and replay routed firmware
        run: |
          mkdir "$RUNNER_TEMP/weftline"
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/weftline:/work" \
            -e SOURCE_COMMIT="$(git rev-parse HEAD)" -e SOURCE_REPO="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -e WORKFLOW_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --entrypoint sh ghcr.io/librelane/librelane@sha256:f91b21d75f79871f9ccf37451020b5d2f7b3236881a997ff709c561e8280a30f \
            /repo/asic/slot16/silicon/harden.sh /work/build /repo/tt
      - name: Collect shuttle inputs
        run: |
          mkdir handoff
          cp -r "$RUNNER_TEMP/weftline/build/tt_submission" handoff/
          cp asic/slot16/silicon/info.yaml handoff/
      - uses: actions/upload-artifact@v7
        with:
          name: tt_submission
          path: handoff
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: weftline-physical-evidence
          path: |
            ${{ runner.temp }}/weftline/build/src/runs/weftline/final/metrics.*
            ${{ runner.temp }}/weftline/build/src/runs/weftline/final/render/
            ${{ runner.temp }}/weftline/build/src/runs/weftline/sram-control/comparison.json
            ${{ runner.temp }}/weftline/build/src/runs/weftline/*/reports/
            ${{ runner.temp }}/weftline/build/src/runs/weftline/*-openroad-stapostpnr/*/*.rpt

  precheck:
    needs: harden
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: TinyTapeout/tt-gds-action/precheck@df73a1e7b52e940423ff55f9354b2b8140d38cb7
        with:
          tools-ref: 7d2d2ef5261eb1df16d0bc342834d48a8a276881
