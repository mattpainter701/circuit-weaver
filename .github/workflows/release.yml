name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" "twine>=5,<7"

      - name: Verify tag matches package version
        id: version
        shell: bash
        run: |
          package_version=$(PYTHONPATH=src python -c "import circuit_weaver; print(circuit_weaver.__version__)")
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" != "v${package_version}" ]; then
            echo "::error::Tag/version mismatch: tag is $GITHUB_REF_NAME but package is $package_version"
            exit 1
          fi

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Verify electrical benchmark scorecard
        run: |
          python -m pip install -e ".[test]"
          python benchmarks/run.py --check-baseline --output .release-benchmark/scorecard.json

      - name: Verify built wheel metadata
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import email
          import glob
          import os
          import tarfile
          import zipfile

          wheels = glob.glob("dist/*.whl")
          archives = glob.glob("dist/*.tar.gz")
          assert len(wheels) == 1, wheels
          assert len(archives) == 1, archives
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
              assert not any("__pycache__" in name or name.endswith((".pyc", ".pyo")) for name in names)
              assert "circuit_weaver/examples/iot_sensor.yaml" in names
              metadata_files = [name for name in wheel.namelist() if name.endswith(".dist-info/METADATA")]
              assert len(metadata_files) == 1, metadata_files
              package_metadata = email.message_from_bytes(wheel.read(metadata_files[0]))
          with tarfile.open(archives[0], "r:gz") as source_archive:
              source_names = source_archive.getnames()
          assert any(name.endswith("/src/circuit_weaver/examples/iot_sensor.yaml") for name in source_names)
          assert not any(
              "__pycache__" in name or name.endswith((".pyc", ".pyo"))
              for name in source_names
          )
          assert package_metadata["Name"] == "circuit-weaver"
          assert package_metadata["Version"] == os.environ["PACKAGE_VERSION"]
          PY

      - name: Upload release distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  test-wheel:
    name: Test wheel / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - name: Checkout tests
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download exact release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist

      - name: Install exact release wheel with test dependencies
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name 'circuit_weaver-*.whl' -print -quit)
          test -n "$wheel"
          python -m pip install --upgrade pip
          python -m pip install "${wheel}[test]"

      - name: Verify installed version and provenance
        shell: bash
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version
          from pathlib import Path

          import circuit_weaver

          expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          installed_path = Path(circuit_weaver.__file__).resolve()
          assert circuit_weaver.__version__ == version("circuit-weaver") == expected
          assert "site-packages" in installed_path.parts or "dist-packages" in installed_path.parts
          PY

      - name: Ruff
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python -m ruff check src tests

      - name: Test exact wheel (full suite, including integration corpus)
        run: >-
          python -c "import os, pytest;
          os.environ.pop('CI', None);
          os.environ['CIRCUIT_WEAVER_TEST_PACKAGE'] = 'wheel';
          raise SystemExit(pytest.main(['tests', '-q']))"

  kicad-validation:
    name: Validate generated schematics with KiCad ${{ matrix.kicad-major }}
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.container-image }}
      options: --user 0
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - kicad-major: "8"
            container-image: ghcr.io/kicad/kicad:8.0@sha256:5716d82aa247abdbe512650eb4e8fce5a4031cbbef0a2c8df83208a69fef87b2
          - kicad-major: "9"
            container-image: ghcr.io/kicad/kicad:9.0@sha256:e638b79b0321f29395a5b783e94bb9f3c73303e8da15da27b8f5cb4b67a37729
          - kicad-major: "10"
            container-image: ghcr.io/kicad/kicad:10.0@sha256:18693567392b80da435f9fa952ce3a3e534c66eb5a6033f5b9c80aa3b19dd3ec
    steps:
      - name: Install checkout and validation prerequisites in the KiCad container
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -o Acquire::Retries=3 -o APT::Update::Error-Mode=any
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends -o Acquire::Retries=3 \
            python3-venv curl git ca-certificates

      - name: Checkout samples
        uses: actions/checkout@v7

      - name: Download exact release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist

      - name: Prepare official KiCad container and runtime
        shell: bash
        run: bash scripts/prepare_kicad_ci_container.sh "${{ matrix.kicad-major }}"

      - name: Install exact release wheel with native test dependencies
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name 'circuit_weaver-*.whl' -print -quit)
          test -n "$wheel"
          python -m pip install "${wheel}" pytest

      - name: Generate representative simple and complex designs
        run: |
          python -m circuit_weaver generate samples/iot_sensor_node/iot_sensor_node.yaml --output .release-kicad/iot --require-kicad --no-svg --no-require-valid --no-readiness-gate
          python -m circuit_weaver generate samples/fpga_power_carrier/fpga_power_carrier.yaml --output .release-kicad/fpga --require-kicad --no-svg --no-require-valid --no-readiness-gate

      - name: Parse and run ERC with KiCad CLI
        run: |
          kicad-cli sch erc --exit-code-violations --format json --output .release-kicad/iot/erc.json .release-kicad/iot/IoT_Sensor_Node.kicad_sch
          kicad-cli sch erc --exit-code-violations --format json --output .release-kicad/fpga/erc.json .release-kicad/fpga/FPGA_Power_Carrier.kicad_sch
          test -s .release-kicad/iot/erc.json
          test -s .release-kicad/fpga/erc.json

      - name: Round-trip authoritative 2-layer and 4-layer PCB goldens
        run: python -m pytest tests/test_pcb_handoff.py -q -k golden_round_trip

      - name: Setup routing runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Route real basic circuits with the exact release wheel
        env:
          CIRCUIT_WEAVER_TEST_PACKAGE: wheel
          CIRCUIT_WEAVER_KICAD_PYTHON: /usr/bin/python3
          CIRCUIT_WEAVER_FREEROUTING: /tmp/freerouting-2.4.1.jar
          CW_REQUIRE_NATIVE_PCB_TESTS: "1"
        run: |
          curl --fail --location --retry 3 https://github.com/freerouting/freerouting/releases/download/v2.4.1/freerouting-2.4.1.jar -o /tmp/freerouting-2.4.1.jar
          echo '251101c3eeac22d7e7dfcf6796603279e5d1000283eb82d8f093780f7afc6aa9  /tmp/freerouting-2.4.1.jar' | sha256sum --check
          python -m pytest tests/test_native_pcb_workflow.py tests/test_native_pcb_preview.py -q

  publish:
    name: Publish exact tested distributions
    needs: [build, test-wheel, kicad-validation]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download exact tested distributions
        uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
