name: Validate Designs

on:
  push:
    branches: [main]
    paths:
      - "samples/**/*.yaml"
      - "src/circuit_weaver/examples/**/*.yaml"
      - "src/circuit_weaver/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/validate-design.yml"
  pull_request:
    paths:
      - "samples/**/*.yaml"
      - "src/circuit_weaver/examples/**/*.yaml"
      - "src/circuit_weaver/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/validate-design.yml"

concurrency:
  group: validate-design-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install circuit-weaver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate sample designs
        run: |
          failed=0
          for spec in samples/*/design_spec.yaml samples/*/*.yaml; do
            [ -f "$spec" ] || continue
            # Skip canonical_spec.yaml (generated output, not an input spec)
            case "$spec" in */canonical_spec.yaml) continue ;; esac
            # Skip nested output copies under samples/*/samples/
            case "$spec" in */samples/*) continue ;; esac
            echo "::group::Validating $spec"
            if python -m circuit_weaver validate "$spec"; then
              echo "PASS: $spec"
            else
              echo "::error file=$spec::Validation failed for $spec"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Validate example designs
        run: |
          failed=0
          for spec in src/circuit_weaver/examples/*.yaml; do
            [ -f "$spec" ] || continue
            echo "::group::Validating $spec"
            if python -m circuit_weaver validate "$spec"; then
              echo "PASS: $spec"
            else
              echo "::error file=$spec::Validation failed for $spec"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
