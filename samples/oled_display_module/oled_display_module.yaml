# OLED display module with voltage level shifting.
# Demonstrates mixed-voltage I2C communication:
#   - USB-C 5V input with AP2112K LDO for 3.3V main rail
#   - Adafruit PID 938 1.3-inch SSD1306 breakout, mounted with its real
#     KiCad footprint and 8-pin through-hole interface
#   - MCP1700-1802E LDO for 1.8V analog rail
#   - TXS0102 bidirectional level shifter, VDD_1P8 ↔ VDD_3P3
# The selected module includes its own 3.3V regulator and level shifting.
# Its I2C strap is set for address 0x3D; its 3Vo output is intentionally unused.

project: OLED_Display_Module
company: Demo Corp
description: 5V USB-C powered Adafruit 1.3-inch 128x64 SSD1306 OLED module with I2C interface

power:
  - type: ldo
    ic: AP2112K-3.3
    ref: U1
    vin: 5
    vout: 3.3
    vin_net: VBUS_5V
    rail_name: VDD_3P3
  - type: ldo
    ic: MCP1700-1802E
    ref: U4
    vin: 3.3
    vout: 1.8
    vin_net: VDD_3P3
    rail_name: VDD_1P8

digital:
  - ic: ADAFRUIT-938
    ref: U2
    # Native Display:Adafruit_SSD1306 pad row: DATA, CLK, DC, RST, CS,
    # VIN, 3Vo, GND. Ground CS and set DC/SA0 high for the 128x64 0x3D
    # address. Reset RC support is generated from the component definition.
    pin_nets_extra:
      "1": I2C_SDA
      "2": I2C_SCL
      "3": VDD_3P3
      "4": OLED_RESET_N
    power_pins_extra:
      "5": GND
      "6": VDD_3P3
      "8": GND
    no_connects: ["7"]
  - type: level_shifter
    ic: TXS0102
    ref: U3
    vcca_net: VDD_1P8
    vccb_net: VDD_3P3
    # The unused A/B channels stay disconnected; OE is pulled high by the
    # level-shifter topology so the device's enable pin is not left floating.
    no_connects: ["1", "4", "5", "8"]

connectors:
  - ic: USB-C-PWR
    ref: J1
