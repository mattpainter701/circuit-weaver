# Sprint 41 corpus — wearable battery-management system.
# Demonstrates a coin-cell / Li-Po powered wearable:
#   - USB-C input with MCP73831 Li-Po charger
#   - MAX17048 fuel gauge on the battery rail
#   - MCP1700 LDO dropping 3.7V battery to 1.8V logic
#   - nRF52840 BLE SoC as the host with SWD / RESET tied off

project: Wearable_BMS
company: Demo Corp
description: BLE wearable with Li-Po charging and fuel-gauge monitoring

power:
  - type: battery_charger
    ic: MCP73831T-2ACI/OT
    ref: U1
    ichg: 0.2
    vin_net: VBUS_5V
    bat_net: VBAT
    no_connects: ["1"]
  - type: battery_monitor
    ic: MAX17048G+T
    ref: U2
    bat_net: VBAT
  - type: ldo
    ic: MCP1700-3302E
    ref: U3
    vin: 3.7
    vout: 1.8
    vin_net: VBAT
    rail_name: VDD_1P8

digital:
  - ic: nRF52840-QIAA
    ref: U4
    # Leave the unused DC/DC output unconnected; programming pins are
    # intentionally unavailable on this minimal wearable board.
    power_pins_extra:
      "A22": VDD_1P8
      "B1": VDD_1P8
      "W1": VDD_1P8
      "AD14": VDD_1P8
      "AD23": VDD_1P8
      "Y2": VDD_1P8
    pin_nets_extra:
      "G1": I2C_SCL
      # TWIM PSEL maps SDA to P0.04 (outer aQFN pad J1). The former
      # inner-row H2/P0.27 choice could not escape with the prototype's
      # two copper layers and default through-via geometry. Firmware must
      # select SCL=P0.26 and SDA=P0.04 for this board.
      "J1": I2C_SDA
    no_connects: ["AA24", "AC24", "AC13", "B3", "AB2"]
  - ic: 32MHz-XTAL-CL8
    ref: Y1

# Nordic's 8 pF prototype crystal assumption and 2 pF board stray imply
# 12 pF load caps per side. Select a production crystal with <=40 ppm tolerance.

connectors:
  - ic: USB-C-PWR
    ref: J1
