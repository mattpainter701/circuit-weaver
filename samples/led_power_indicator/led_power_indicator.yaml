# Basic: Simple LDO-powered LED indicator
# Demonstrates a minimal circuit — 3.3V LDO from 5V USB input with LED
project: LED_Power_Indicator
company: Demo Corp
description: Simple 3.3V LDO regulator with power indicator LED

power:
  - type: ldo
    ic: AMS1117-3.3
    ref: U1
    vin: 5
    vout: 3.3
    vin_net: VBUS_5V
    rail_name: VDD_3P3

connectors:
  - ic: USB-C-PWR
    ref: J1

# Explicit mechanical intent for the review prototype. At zero rotation this
# footprint's receptacle mouth faces the bottom edge. Keep its courtyard inside
# the outline; enclosure fit and connector overhang still require review.
pcb_constraints:
  - kind: placement
    target: board
    width_mm: 36
    height_mm: 30
  - kind: placement
    target: J1
    edge: bottom
    rotation: 0
    max_distance_mm: 0.5
